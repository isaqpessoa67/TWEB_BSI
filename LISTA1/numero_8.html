<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário com radio e checkbox</title>
</head>
<body>
    <form>
        <label>Masculino</label>
        <input type="radio">
        <label>Feminino</label>
        <input type="radio">
        <label>Não binário</label>
        <input type="radio">
        <label>Prefiro nãp responder</label>
        <input type="radio">
        <label>Outro</label>
        <input type="text">
        <label>CONCORDO COM OS TERMOS DE SERVIÇO</label>
        <input type="checkbox">
        <input type="button" value="Enviar">
    </form>
</body>
</html>
